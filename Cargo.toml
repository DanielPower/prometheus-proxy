[package]
name = "prometheus-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.4"
tower-http = { version = "0.6", features = ["trace"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
dotenv = "0.15.0"
env_logger = "0.11.8"
log = "0.4"
